<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Трекер привычек</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Трекер привычек</h1>
      <p class="subtitle">Отмечайте выполнение привычек каждый день и следите за стриком</p>
    </header>

    <form id="add-form" class="add-form">
      <input
        type="text"
        id="habit-name"
        placeholder="Например: пить 2 л воды"
        maxlength="100"
        required
      />
      <button type="submit">Добавить</button>
    </form>

    <p id="error-message" class="error hidden"></p>

    <ul id="habit-list" class="habit-list"></ul>

    <p id="empty-state" class="empty-state hidden">
      Пока нет ни одной привычки — добавьте первую выше.
    </p>
  </div>

  <script src="app.js"></script>
</body>
</html>
